<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StudyVault - simple university study material portal" />
  <title>StudyVault</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav-wrap">
      <button class="brand" data-route="#/" aria-label="StudyVault home">
        <span class="brand-mark">S</span>
        <span>
          <strong>StudyVault</strong>
          <small>University Study Portal</small>
        </span>
      </button>
      <nav class="nav-actions">
        <button class="text-btn" data-route="#/">Home</button>
        <button class="text-btn" data-route="#/search">Search</button>
        <button class="admin-btn" data-route="#/admin">Admin</button>
      </nav>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="container footer-row">
      <span>StudyVault</span>
      <span>Simple • Fast • Student Friendly</span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
